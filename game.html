<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offense vs Defense Game</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: white;
        }
        #gameArea {
            width: 600px;
            height: 400px;
            border: 4px solid #ecf0f1;
            border-radius: 10px;
            position: relative;
            margin: 20px auto;
            overflow: hidden;
            background: linear-gradient(135deg, #1abc9c, #3498db);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        #target {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, red, darkred);
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.7);
            transition: transform 0.1s;
        }
        #target:active {
            transform: scale(0.9);
        }
        h1, h2, h3 {
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        }
        #restartBtn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: #e74c3c;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
        }
        #restartBtn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>
    <h1>Offense vs Defense Game</h1>
    <p>Offense (Player 1) clicks the target. Defense (Player 2) moves it with arrow keys.</p>
    <h2>Score: <span id="score">0</span></h2>
    <div id="gameArea">
        <div id="target"></div>
    </div>
    <h3 id="timer">Time: 30</h3>
    <button id="restartBtn">Restart Game</button>
    <script>
        const target = document.getElementById("target");
        const scoreDisplay = document.getElementById("score");
        const timerDisplay = document.getElementById("timer");
        const gameArea = document.getElementById("gameArea");
        const restartBtn = document.getElementById("restartBtn");

        let score = 0;
        let timeLeft = 30;
        let targetX = 100, targetY = 100;
        let timer;

        // Add sound effects
        const clickSound = new Audio("click-sound.mp3"); // Replace with your sound file path
        const gameOverSound = new Audio("game-over-sound.mp3"); // Replace with your sound file path

        function updateTargetPosition() {
            target.style.left = `${targetX}px`;
            target.style.top = `${targetY}px`;
        }

        document.addEventListener("keydown", (event) => {
            const step = 20;
            if (event.key === "ArrowUp" && targetY > 0) targetY -= step;
            if (event.key === "ArrowDown" && targetY < 360) targetY += step;
            if (event.key === "ArrowLeft" && targetX > 0) targetX -= step;
            if (event.key === "ArrowRight" && targetX < 560) targetX += step;
            updateTargetPosition();
        });

        target.addEventListener("click", () => {
            score++;
            scoreDisplay.textContent = score;
            clickSound.play(); // Play click sound
            targetX = Math.random() * 560;
            targetY = Math.random() * 360;
            updateTargetPosition();
        });

        function startGame() {
            score = 0;
            timeLeft = 30;
            scoreDisplay.textContent = score;
            timerDisplay.textContent = `Time: ${timeLeft}`;
            clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = `Time: ${timeLeft}`;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    gameOverSound.play(); // Play game over sound
                    alert(`Game Over! Final Score: ${score}`);
                }
            }, 1000);
            updateTargetPosition();
        }

        restartBtn.addEventListener("click", startGame);

        startGame();
    </script>
</body>
</html>
