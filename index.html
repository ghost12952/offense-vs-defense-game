<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coloring Game</title>
    <style>
        body { text-align: center; font-family: Arial, sans-serif; }
        canvas { border: 2px solid black; cursor: crosshair; }
        .controls { margin: 10px; }
    </style>
</head>
<body>
    <h1>Coloring Game</h1>
    <div class="controls">
        <input type="color" id="colorPicker" value="#000000">
        <input type="range" id="brushSize" min="2" max="20" value="5">
        <button onclick="clearCanvas()">Clear</button>
    </div>
    <canvas id="canvas" width="500" height="500"></canvas>
    
    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        let painting = false;
        let brushColor = document.getElementById("colorPicker").value;
        let brushSize = document.getElementById("brushSize").value;

        canvas.addEventListener("mousedown", () => painting = true);
        canvas.addEventListener("mouseup", () => painting = false);
        canvas.addEventListener("mousemove", draw);

        document.getElementById("colorPicker").addEventListener("input", (e) => brushColor = e.target.value);
        document.getElementById("brushSize").addEventListener("input", (e) => brushSize = e.target.value);

        function draw(event) {
            if (!painting) return;
            ctx.fillStyle = brushColor;
            ctx.beginPath();
            ctx.arc(event.offsetX, event.offsetY, brushSize / 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    </script>
</body>
</html>
